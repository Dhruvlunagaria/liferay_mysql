apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: liferay-app
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    path: .
    repoURL: https://github.com/Dhruvlunagaria/liferay_mysql.git
    targetRevision: HEAD
  project: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
